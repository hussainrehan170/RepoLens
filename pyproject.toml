[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "Compare a published package with its source repository and flag suspicious differences."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.9",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
repolens = "repolens.cli:app"

[tool.setuptools.packages.find]
include = ["repolens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
